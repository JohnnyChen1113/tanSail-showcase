allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

# https://pnpm.io/settings#minimumreleaseage
# https://pnpm.io/supply-chain-security#delay-dependency-updates
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # Version-specific exceptions for packages released on the template creation date.
  # Future versions remain protected by the 24-hour maturity window.
  - "@voidzero-dev/vite-plus-core@0.2.6"
  - "@voidzero-dev/vite-plus-darwin-arm64@0.2.6"
  - "@voidzero-dev/vite-plus-darwin-x64@0.2.6"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@0.2.6"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@0.2.6"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@0.2.6"
  - "@voidzero-dev/vite-plus-linux-x64-musl@0.2.6"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@0.2.6"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@0.2.6"
  - "brace-expansion@5.0.8"
  - "lucide-react@1.26.0"
  - "shadcn@4.14.1"
  - "systeminformation@5.33.1"
  - "vite-plus@0.2.6"

# Save exact versions to package.json instead of broad ranges
savePrefix: ""

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.6
  vite-plus: 0.2.6
overrides:
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
